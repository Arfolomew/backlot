<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- MiniMax Studio: black plate, bold white M. The M is drawn as a stroked
       path rather than text so it never depends on a font being installed. -->
  <rect width="100" height="100" fill="#000000"/>
  <path d="M 22 76 L 22 24 L 50 57 L 78 24 L 78 76"
        fill="none" stroke="#ffffff" stroke-width="13"
        stroke-linejoin="miter" stroke-linecap="square" stroke-miterlimit="10"/>
</svg>
